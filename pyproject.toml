[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-rca-benchmark"
version = "0.1.0"
description = "Reproducible incident-level RCA benchmark for MANO, Core and OCS"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
rcaeval = ["pandas>=2,<3", "pyarrow>=14"]
ml = ["scikit-learn>=1.3,<2"]

[project.scripts]
rca-bench = "rca_bench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rca_bench*"]
